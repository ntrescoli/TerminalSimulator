<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Simulator - Ejemplo Vanilla JS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .terminal-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            min-height: 500px;
        }

        #terminal-container {
            width: 100%;
            height: 100%;
            min-height: 500px;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 0.95rem;
        }

        .footer a {
            color: #4dd0e1;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .footer a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ Terminal Simulator</h1>
            <p>Ejemplo interactivo - Vanilla JavaScript</p>
        </div>

        <div class="terminal-wrapper">
            <div id="terminal-container"></div>
        </div>

        <div class="footer">
            <p>Prueba comandos como: <code>ls</code>, <code>whoami</code>, <code>mkdir test</code>, <code>cd /home</code></p>
            <p>📚 <a href="https://github.com/tu-usuario/terminal-simulator">Ver documentación</a></p>
        </div>
    </div>

    <script type="module">
        // Importar TSTerminal desde el paquete instalado
        import { TSTerminal } from '../dist/terminal-simulator.js';
        import '../dist/style.css';

        // Crear instancia de la terminal
        const container = document.getElementById('terminal-container');
        const terminal = new TSTerminal(container);

        console.log('✅ Terminal Simulator initialized!');
    </script>
</body>
</html>
